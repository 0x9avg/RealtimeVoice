<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Настройка робота — RealtimeVoice</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6fb;
    --card: #ffffff;
    --ink: #1c2430;
    --ink-dim: #5b6472;
    --accent: #2f6fed;
    --accent-ink: #ffffff;
    --ok: #1c9d5a;
    --ok-bg: #e7f8ee;
    --warn: #b3720a;
    --warn-bg: #fdf3e0;
    --bad: #c53030;
    --bad-bg: #fde8e8;
    --border: #e1e6ef;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
  }
  .shell { max-width: 720px; margin: 0 auto; padding: 24px 16px 64px; }
  .shell.wide { max-width: 1000px; }
  header.top {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
  }
  header.top h1 { font-size: 20px; margin: 0; }
  header.top .sub { margin: 2px 0 0; color: var(--ink-dim); font-size: 14px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 600;
    background: var(--border); color: var(--ink-dim);
  }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.bad { background: var(--bad-bg); color: var(--bad); }
  .pill.warn { background: var(--warn-bg); color: var(--warn); }

  .steps {
    display: flex; gap: 6px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .step-dot {
    flex: 1; min-width: 40px; text-align: center; padding: 8px 4px;
    border-radius: 10px; background: var(--card); border: 1px solid var(--border);
    font-size: 13px; color: var(--ink-dim); cursor: pointer; user-select: none;
  }
  .step-dot.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .step-dot.done { color: var(--ok); }

  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 24px; margin-bottom: 16px;
  }
  .card h2 { margin-top: 0; font-size: 20px; }
  .card p.hint { color: var(--ink-dim); font-size: 15px; }

  /* ---- settings menu (configured robot) ------------------------------ */
  .layout { display: grid; grid-template-columns: 232px 1fr; gap: 16px; align-items: start; }
  .side {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 8px; position: sticky; top: 16px;
  }
  .side-item {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    padding: 11px 12px; border-radius: 10px; border: none; background: none;
    font: inherit; font-weight: 600; color: var(--ink); cursor: pointer;
  }
  .side-item:hover { background: #f2f5fb; }
  .side-item.active { background: var(--accent); color: var(--accent-ink); }
  .side-item .ico { font-size: 17px; width: 22px; text-align: center; flex: none; }
  .side-item .dot { margin-left: auto; color: var(--warn); font-size: 18px; line-height: 1; }
  .side-item.active .dot { color: var(--accent-ink); }
  .side-sep { height: 1px; background: var(--border); margin: 8px 6px; }
  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    .side { position: static; display: flex; gap: 6px; overflow-x: auto; padding: 8px; }
    .side-item { width: auto; white-space: nowrap; }
    .side-item .label { display: none; }
    .side-item.active .label { display: inline; }
    .side-sep { display: none; }
  }

  .banner {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    background: var(--warn-bg); color: var(--warn); border: 1px solid #f0dcb4;
    border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 15px;
  }
  .banner button { margin-left: auto; }

  .kv { display: grid; grid-template-columns: minmax(140px, auto) 1fr; gap: 8px 16px; margin: 4px 0 0; }
  .kv dt { color: var(--ink-dim); }
  .kv dd { margin: 0; font-weight: 600; }

  .save-bar {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);
  }

  .choice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
  @media (max-width: 480px) { .choice-grid { grid-template-columns: 1fr; } }
  .choice {
    border: 2px solid var(--border); border-radius: 14px; padding: 18px 14px;
    text-align: center; cursor: pointer; background: #fff; transition: border-color .15s;
  }
  .choice:hover { border-color: #c7d3ea; }
  .choice.selected { border-color: var(--accent); background: #eef4ff; }
  .choice .emoji { font-size: 30px; display: block; margin-bottom: 8px; }
  .choice .title { font-weight: 700; }
  .choice .sub { color: var(--ink-dim); font-size: 14px; margin-top: 4px; }

  label.field { display: block; margin: 14px 0; }
  label.field span.lbl { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=text], input[type=password], input[type=number], select {
    width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    font-size: 16px; background: #fff; color: var(--ink);
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row > * { flex: 1; }
  .row.tight > * { flex: none; }

  button {
    font: inherit; border: none; border-radius: 10px; padding: 12px 18px;
    font-weight: 700; cursor: pointer; font-size: 15px;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  button.ghost { background: #fff; border: 1px solid var(--border); color: var(--ink); }
  button.danger { background: var(--bad-bg); color: var(--bad); }
  button.small { padding: 8px 12px; font-size: 14px; }

  .nav-bottom { display: flex; justify-content: space-between; margin-top: 8px; }

  .msg { margin-top: 12px; padding: 12px 14px; border-radius: 10px; font-size: 14px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .msg.warn { background: var(--warn-bg); color: var(--warn); }
  .msg.info { background: #eef4ff; color: var(--accent); }

  .checklist { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
  .checklist label {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
  }
  .checklist input { width: 18px; height: 18px; }

  .log-line { font-family: ui-monospace, monospace; font-size: 12px; color: var(--ink-dim); }
  .log-entry { margin-bottom: 6px; }
  .log-entry .friendly { font-family: inherit; font-size: 14px; color: var(--ink); }
  .spinner { display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid #ccc; border-top-color: var(--accent); animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .muted { color: var(--ink-dim); font-size: 14px; }
  a.link { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="shell" id="app">Загрузка…</div>

<script>
// The page has two faces over one set of API endpoints:
//
//   "wizard"   — the linear first-run guide, for a robot that has never
//                been configured. Numbered steps, one decision per screen,
//                ending in "Запустить робота".
//   "settings" — a settings MENU (sidebar + panes, like a game's options
//                screen) for a robot that is already set up: same knobs,
//                but reachable directly in any order, with no walkthrough
//                to sit through just to change one wake word.
//
// Which one opens is decided by the server's `setup_complete` (profile +
// API key + installed unit), NOT by whether the service happens to be
// running this second — see app/installer/server.py's comment there.
//
// Both faces share the SAME editors (EDITORS below): the wizard renders
// one per step, the settings menu renders one per section. There is
// deliberately no second implementation of "how do I edit wake words" —
// that duplication is how the two faces would drift apart.

const DEFAULT_WAKE_WORDS = [
  // Must track app/config.py's WAKE_WORD_PHRASES default — kept as a
  // suggestion list here only; the source of truth is whatever ends up
  // saved to .env, not this array.
  "робот", "ассистент", "помощник", "слушай", "здравствуйте", "привет",
  "подскажите", "посетитель", "визит", "оформите", "зарегистрируйте",
];

let state = null;      // last /api/state response
let view = "loading";  // "wizard" | "settings"
let advancedGroups = null; // lazily loaded when the "Расширенные" section opens
let wizardStep = 0;
let section = "overview";  // active settings-menu section
let dirty = false;         // unsaved edits in the current settings section
let restartNeeded = false; // something was saved while the service was running
let draft = {};            // in-progress edits not yet confirmed by the server

const STEP_IDS = ["welcome", "profile", "key", "audio", "wake", "extra", "finish"];
const STEP_TITLES = ["Начало", "Робот", "Ключ Gemini", "Устройства", "Пробуждение", "Дополнительно", "Готово"];

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-JSON (e.g. audio/wav) */ }
  if (!res.ok) {
    const detail = (data && data.detail) ? data.detail : res.statusText;
    throw new Error(detail);
  }
  return data;
}

async function refreshState() {
  state = await api("GET", "/api/state");
  // NOT drafted: nothing on this page edits these two directly any more --
  // the operator's live choice on the robot's page owns them (session_hub's
  // _remember_audio_choice), so they are read straight from the server
  // every refresh instead of being cached in an editable draft that could
  // show a stale source after someone switched mics on :8000.
  if (draft.hardware_audio === undefined) {
    // One deployment-level question ("does this robot use its own mic and
    // speaker at all"), not the browser/robot/USB tri-choice this used to
    // ask. Picking WHICH hardware source is live belongs to the robot's own
    // page -- see the editor body for why.
    draft.hardware_audio = state.audio_input !== "browser" || state.audio_output !== "browser";
  }
  if (draft.usb_mic_alsa_device === undefined) draft.usb_mic_alsa_device = state.usb_mic_alsa_device;
  if (draft.usb_speaker_alsa_device === undefined) draft.usb_speaker_alsa_device = state.usb_speaker_alsa_device;
  if (draft.checked_defaults === undefined) {
    // Split into two fields (which default checkboxes are ticked, and
    // what custom words were typed) instead of one merged list -- audit
    // fix, 2026-09-06: a single merged `wake_words` array made the custom-
    // words textbox a pure ADD-only union, so a customer removing a word
    // from that textbox to stop a false-wake nuisance saw it silently
    // reappear on every save.
    const existing = state.wake_word_phrases
      ? state.wake_word_phrases.split(",").map(s => s.trim()).filter(Boolean)
      : DEFAULT_WAKE_WORDS.slice();
    draft.checked_defaults = DEFAULT_WAKE_WORDS.filter(w => existing.includes(w));
    draft.custom_words = existing.filter(w => !DEFAULT_WAKE_WORDS.includes(w));
  }
  if (draft.presence_enabled === undefined) draft.presence_enabled = state.presence_enabled;
  if (draft.wall_agent_url === undefined) draft.wall_agent_url = state.wall_agent_url;
}

function statusPill() {
  if (!state || !state.service_installed) return `<span class="pill">ещё не запущен</span>`;
  const active = state.service_status && state.service_status.is_active;
  return active
    ? `<span class="pill ok">🟢 работает</span>`
    : `<span class="pill bad">🔴 остановлен</span>`;
}

function robotUrl() {
  return `http://${state.lan_ip}:${state.port}`;
}

function render() {
  const root = document.getElementById("app");
  root.className = view === "settings" ? "shell wide" : "shell";
  if (view === "settings") { root.innerHTML = renderSettings(); bindSettings(); return; }
  root.innerHTML = renderWizard();
  bindWizard();
}

// ---------------------------------------------------------------- editors --
//
// One entry per topic. `body()` renders the form, `bind(root)` wires it up,
// `save()` persists it. Used by both faces of the page.

const EDITORS = {
  profile: {
    icon: "🤖",
    title: () => "Какой это робот?",
    body: bodyProfile,
    bind: bindProfile,
    save: async () => {},   // the choice is POSTed the moment it is clicked
  },
  key: {
    icon: "🔑",
    title: () => "Ключ доступа к Gemini",
    body: bodyApiKey,
    bind: bindApiKey,
    save: saveApiKey,
  },
  audio: {
    icon: "🎧",
    title: () => "Аудиоустройства",
    body: bodyAudio,
    bind: bindAudio,
    save: saveAudio,
  },
  wake: {
    icon: "👂",
    title: () => "Как разбудить робота",
    body: bodyWake,
    bind: bindWake,
    save: saveWake,
  },
  extra: {
    icon: "🗂️",
    title: () => (state.profile === "r1" ? "Видеостена" : "Справочник поста охраны"),
    body: bodyExtra,
    bind: bindExtra,
    save: saveExtra,
  },
};

function bodyProfile() {
  const sel = (p) => (state.profile === p ? "selected" : "");
  const applyBlock = view === "settings" ? `
    <p class="muted">Смена робота меняет всю роль: приветствие, набор голосовых команд и список
    настроек ниже. Служба предыдущей роли останавливается автоматически — после смены нажмите
    «Применить», чтобы установить и запустить службу для новой.</p>
    <div class="row tight">
      <button class="ghost" id="btn-apply-profile">Применить и запустить службу</button>
    </div>` : "";
  return `
    <p class="hint">Выберите модель — от этого зависит набор настроек.</p>
    <div class="choice-grid">
      <div class="choice ${sel("r1")}" data-profile="r1">
        <span class="emoji">🖥️</span><span class="title">R1</span>
        <span class="sub">Робот-презентатор у видеостены</span>
      </div>
      <div class="choice ${sel("g1")}" data-profile="g1">
        <span class="emoji">🛡️</span><span class="title">G1</span>
        <span class="sub">Робот поста охраны</span>
      </div>
    </div>
    ${applyBlock}
    <div id="profile-msg"></div>`;
}

function bindProfile(root) {
  root.querySelectorAll(".choice[data-profile]").forEach(el => el.addEventListener("click", async () => {
    if (el.dataset.profile === state.profile) return;
    try {
      const res = await api("POST", "/api/profile", { profile: el.dataset.profile });
      // The advanced catalogue is filtered per profile server-side, so
      // whatever is cached belongs to the OLD role now.
      advancedGroups = null;
      draft.wall_agent_url = undefined;
      await refreshState();
      render();
      if (res.stopped_previous) {
        showMsg("profile-msg", "warn",
          "Служба предыдущей роли остановлена. Нажмите «Применить и запустить службу», " +
          "чтобы поднять новую.");
      }
    } catch (e) { showMsg("profile-msg", "bad", e.message); }
  }));
  const apply = root.querySelector("#btn-apply-profile");
  if (apply) apply.addEventListener("click", () => runFinish("profile-msg"));
}

function bodyApiKey() {
  return `
    <p class="hint">Это код, который даёт роботу возможность понимать речь и отвечать голосом.
    Его выдаёт Google AI Studio — обычно его присылает поставщик системы.</p>
    <label class="field">
      <span class="lbl">Ключ API</span>
      <input type="password" id="api-key-input" placeholder="Вставьте ключ сюда" value="" />
    </label>
    <p class="muted">${state.api_key_set
      ? "Ключ уже сохранён. Оставьте поле пустым, чтобы не менять его."
      : "Ключ ещё не задан."}</p>
    <div class="row tight">
      <button class="ghost" id="btn-test-key">Проверить ключ</button>
    </div>
    <div id="key-msg"></div>`;
}

function bindApiKey(root) {
  root.querySelector("#btn-test-key").addEventListener("click", async () => {
    const val = document.getElementById("api-key-input").value;
    if (!val.trim()) { showMsg("key-msg", "bad", "Введите ключ."); return; }
    showMsg("key-msg", "info", `<span class="spinner"></span> Проверяю…`);
    try {
      const res = await api("POST", "/api/api-key", { api_key: val });
      draft.apiKeyJustSet = res.ok;
      showMsg("key-msg", res.ok ? "ok" : "bad", res.message);
      await refreshState();
    } catch (e) { showMsg("key-msg", "bad", e.message); }
  });
}

async function saveApiKey() {
  const keyInput = document.getElementById("api-key-input");
  if (keyInput && keyInput.value.trim()) {
    await api("POST", "/api/api-key", { api_key: keyInput.value.trim() });
  }
}

function bodyAudio() {
  // Scope note (2026-09-07, explicit ask: "управление выводом и вводом звука
  // должно быть полностью в :8000"): this page does NOT pick which of the
  // robot's microphones is listening right now -- that switch lives on the
  // robot's own page, takes effect instantly and is now remembered across
  // restarts (app/session_hub.py's _remember_audio_choice). What is left
  // here is the part :8000 structurally cannot do: `AUDIO_INPUT`/
  // `AUDIO_OUTPUT` are read once at process start (session_hub.py:103/138),
  // so whether hardware audio exists at all is a restart-level decision;
  // and naming the ALSA devices, which needs the device enumeration and
  // record/playback tests that only live in app/installer/audio.py.
  const hw = draft.hardware_audio;
  const usbBlock = hw ? `
    <div class="card" style="background:#fafbfd;">
      <p class="muted" style="margin-top:0;">USB-гарнитура, если она подключена. Оставьте «не
      используется», если робот работает только со своим встроенным микрофоном и динамиком.</p>
      <label class="field">
        <span class="lbl">USB-микрофон</span>
        <select id="mic-select"></select>
      </label>
      <div class="row tight">
        <button class="ghost small" id="btn-test-mic">🎙️ Проверить микрофон (2 сек)</button>
        <span id="mic-test-status" class="muted"></span>
      </div>
      <div id="mic-audio-holder"></div>
      <label class="field">
        <span class="lbl">USB-динамик</span>
        <select id="speaker-select"></select>
      </label>
      <div class="row tight">
        <button class="ghost small" id="btn-test-speaker">🔊 Проверить динамик</button>
        <span id="speaker-test-status" class="muted"></span>
      </div>
    </div>` : "";
  return `
    <p class="hint">Здесь задаётся, каким оборудованием робот вообще пользуется, и проверяется, что оно
    работает. Это читается один раз при запуске службы, поэтому изменения требуют перезапуска.</p>
    <div class="checklist">
      <label><input type="checkbox" id="hw-audio" ${hw ? "checked" : ""}/>
      Использовать микрофон и динамик робота</label>
    </div>
    <p class="muted">Если выключить — робот слышит и говорит только через открытую страницу в браузере.
    Это режим проверки с ноутбука; для робота в зале переключатель должен быть включён.</p>
    ${usbBlock}
    <div class="msg info">Переключение «встроенный ↔ USB» во время работы — на
    <a class="link" href="${robotUrl()}" target="_blank">странице робота</a>, мгновенно и без
    перезапуска. Выбор там запоминается и сохраняется после перезагрузки.</div>
    <div id="audio-msg"></div>`;
}

function bindAudio(root) {
  const toggle = root.querySelector("#hw-audio");
  if (toggle) toggle.addEventListener("change", (e) => {
    draft.hardware_audio = e.target.checked;
    markDirty();
    render();
  });
  if (document.getElementById("mic-select")) loadAudioDevices();
  const testMic = root.querySelector("#btn-test-mic");
  if (testMic) testMic.addEventListener("click", async () => {
    const dev = document.getElementById("mic-select").value;
    if (!dev) { document.getElementById("mic-test-status").textContent = "Сначала выберите устройство."; return; }
    document.getElementById("mic-test-status").innerHTML = `<span class="spinner"></span> Говорите…`;
    try {
      const res = await fetch("/api/audio/test-mic", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ alsa_device: dev }),
      });
      if (!res.ok) throw new Error((await res.json()).detail || "ошибка записи");
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      document.getElementById("mic-test-status").textContent = "Готово — прослушайте запись:";
      document.getElementById("mic-audio-holder").innerHTML = `<audio controls src="${url}"></audio>`;
    } catch (e) {
      document.getElementById("mic-test-status").textContent = "❌ " + e.message;
    }
  });
  const testSpeaker = root.querySelector("#btn-test-speaker");
  if (testSpeaker) testSpeaker.addEventListener("click", async () => {
    const dev = document.getElementById("speaker-select").value;
    if (!dev) { document.getElementById("speaker-test-status").textContent = "Сначала выберите устройство."; return; }
    document.getElementById("speaker-test-status").innerHTML = `<span class="spinner"></span> Воспроизвожу…`;
    try {
      await api("POST", "/api/audio/test-speaker", { alsa_device: dev });
      document.getElementById("speaker-test-status").textContent = "Вы услышали короткий сигнал?";
    } catch (e) {
      document.getElementById("speaker-test-status").textContent = "❌ " + e.message;
    }
  });
}

async function saveAudio() {
  const micSel = document.getElementById("mic-select");
  const spkSel = document.getElementById("speaker-select");
  if (micSel) draft.usb_mic_alsa_device = micSel.value;
  if (spkSel) draft.usb_speaker_alsa_device = spkSel.value;
  // Keep whichever hardware source is currently preferred rather than
  // forcing one: the operator may have switched to the USB headset on the
  // robot's page, and that choice is now stored in these very keys.
  const keep = (v) => (v === "robot" || v === "usb" ? v : "robot");
  await api("POST", "/api/audio", {
    audio_input: draft.hardware_audio ? keep(state.audio_input) : "browser",
    audio_output: draft.hardware_audio ? keep(state.audio_output) : "browser",
    // Not cleared when hardware audio is off -- the values are inert then
    // (session_hub only constructs USB devices in hardware mode), and
    // wiping them would lose the device names on a temporary switch to
    // browser mode.
    usb_mic_alsa_device: draft.usb_mic_alsa_device || "",
    usb_speaker_alsa_device: draft.usb_speaker_alsa_device || "",
  });
}

function bodyWake() {
  const boxes = DEFAULT_WAKE_WORDS.map(w => `
    <label><input type="checkbox" data-word="${w}" ${draft.checked_defaults.includes(w) ? "checked" : ""}/> ${w}</label>
  `).join("");
  return `
    <p class="hint">Робот всегда локально слушает, не сказал ли кто-то одно из этих слов — ничего не
    уходит в интернет, пока слово не услышано. Чем больше слов отмечено, тем проще посетителю
    обратиться к роботу без подсказок, но тем чаще случаются случайные срабатывания от обычных
    разговоров рядом.</p>
    <div class="checklist">${boxes}</div>
    <label class="field">
      <span class="lbl">Свои слова (через запятую)</span>
      <input type="text" id="custom-words" value="${escapeHtml(draft.custom_words.join(", "))}" placeholder="например: алло, эй" />
    </label>
    <div style="margin-top:8px;">
      <label><input type="checkbox" id="presence-toggle" ${draft.presence_enabled ? "checked" : ""}/>
      Робот сам замечает подходящего человека по камере и первым здоровается</label>
    </div>
    <div id="wake-msg"></div>`;
}

function bindWake(root) {
  root.querySelectorAll("input[data-word]").forEach(cb => cb.addEventListener("change", () => {
    const w = cb.dataset.word;
    draft.checked_defaults = draft.checked_defaults.filter(x => x !== w);
    if (cb.checked) draft.checked_defaults.push(w);
  }));
  root.querySelector("#presence-toggle").addEventListener("change", (e) => {
    draft.presence_enabled = e.target.checked;
  });
}

async function saveWake() {
  const customInput = document.getElementById("custom-words");
  if (customInput) {
    draft.custom_words = customInput.value.split(",").map(s => s.trim()).filter(Boolean);
  }
  // REPLACE, not union with whatever was saved before -- audit fix,
  // 2026-09-06: the old code merged custom words into the saved list with
  // a Set union, so deleting a word from this textbox (e.g. to stop a
  // false-wake nuisance this very page warns about) never actually
  // removed it; it just reappeared on the next save.
  const phrases = [...new Set([...draft.checked_defaults, ...draft.custom_words])];
  await api("POST", "/api/wake-words", { phrases });
  await api("POST", "/api/presence", { enabled: draft.presence_enabled });
}

function bodyExtra() {
  if (state.profile === "r1") {
    return `
      <p class="hint">Адрес компьютера видеостены, к которому робот будет отправлять команды
      (переключение разделов презентации). Уточните у того, кто настраивал видеостену.</p>

      </label>

  }
  return `
    <p class="hint">Робот отвечает посетителям только тем, что записано в файле
    <code>config/guard-kb.yaml</code> — список кабинетов и часто задаваемых вопросов. Этот файл
    редактируется отдельно (текстовым редактором на роботе или с помощью того, кто устанавливал
    систему) — эта страница только показывает, загружен ли он.</p>
    <div id="kb-status" class="msg info">Проверяю…</div>
    <div id="extra-msg"></div>`;
}

function bindExtra(root) {

}

async function saveExtra() {
  if (state.profile !== "r1") return;
  const wallInput = document.getElementById("wall-url");

// ----------------------------------------------------------------- wizard --

function renderStepper() {
  return `<div class="steps">` + STEP_TITLES.map((title, i) => {
    let cls = "step-dot";
    if (i === wizardStep) cls += " active";
    else if (i < wizardStep) cls += " done";
    return `<div class="${cls}" data-step="${i}">${title}</div>`;
  }).join("") + `</div>`;
}

function renderWizard() {
  const parts = [
    `<header class="top"><h1>Настройка робота</h1>${statusPill()}</header>`,
    renderStepper(),
  ];
  const id = STEP_IDS[wizardStep];
  if (id === "welcome") parts.push(stepWelcome());
  else if (id === "finish") parts.push(stepFinish());
  else {
    const editor = EDITORS[id];
    parts.push(`
      <div class="card">
        <h2>${escapeHtml(editor.title())}</h2>
        ${editor.body()}
        <div class="nav-bottom">
          <button class="ghost" id="btn-back">← Назад</button>
          <button class="primary" id="btn-next" ${id === "profile" && !state.profile ? "disabled" : ""}>Далее →</button>
        </div>
      </div>`);
  }
  return parts.join("");
}

function stepWelcome() {
  return `
    <div class="card">
      <h2>Добро пожаловать 👋</h2>
      <p class="hint">Этот мастер настроит робота за несколько простых шагов — ключ доступа, звук,
      слова для пробуждения. Ничего вручную устанавливать не нужно, всё делается на этой странице.</p>
      <p class="muted">Пройти его нужно один раз. Дальше эта же страница открывается как обычное
      меню настроек, где любой пункт можно поменять отдельно.</p>
      <div class="nav-bottom"><span></span><button class="primary" id="btn-next">Начать →</button></div>
    </div>`;
}

function stepFinish() {
  return `
    <div class="card">
      <h2>Готово к запуску</h2>
      <p class="hint">Проверьте настройки и нажмите «Запустить робота» — он будет включаться
      автоматически при каждой перезагрузке.</p>
      <ul>
        <li>Робот: <b>${state.profiles[state.profile] || state.profile}</b></li>
        <li>Ключ Gemini: <b>${state.api_key_set || draft.apiKeyJustSet ? "задан" : "НЕ задан"}</b></li>
        <li>Звук: <b>${draft.hardware_audio ? "оборудование робота" : "только через браузер"}</b></li>
        <li>Слов для пробуждения: <b>${draft.checked_defaults.length + draft.custom_words.length}</b></li>
      </ul>
      <div class="row tight">
        <button class="ghost" id="btn-back">← Назад</button>
        <button class="primary" id="btn-run">🚀 Запустить робота</button>
      </div>
      <div id="finish-msg"></div>
    </div>`;
}

function bindWizard() {
  const root = document.getElementById("app");
  // 2026-09-06 audit finding: clicking a step-number dot used to jump
  // straight there with no save, so edits made on the step being left
  // (e.g. checking/unchecking wake-word boxes, then clicking "6" instead
  // of "Далее") were silently lost -- the summary on step 6 read them
  // from `draft` (still correct in memory) while .env kept whatever was
  // last actually POSTed, a mismatch between what the customer saw
  // confirmed and what the robot actually started with. Every way of
  // leaving a step now goes through the same save-then-navigate path.
  root.querySelectorAll(".step-dot").forEach(el => el.addEventListener("click", () => {
    goToStep(parseInt(el.dataset.step, 10));
  }));
  const back = root.querySelector("#btn-back");
  if (back) back.addEventListener("click", () => goToStep(Math.max(0, wizardStep - 1)));
  const next = root.querySelector("#btn-next");
  if (next) next.addEventListener("click", onNext);

  const editor = EDITORS[STEP_IDS[wizardStep]];
  if (editor) editor.bind(root);

  if (STEP_IDS[wizardStep] === "finish") {
    root.querySelector("#btn-run").addEventListener("click", () => runFinish("finish-msg"));
  }
}

// Persists whatever the CURRENT step's inputs hold, regardless of how the
// customer is about to leave that step (Далее, Назад, or a stepper dot) --
// see bindWizard's comment for why every navigation path must go through
// this instead of only the "Далее" button.
async function saveCurrentStep() {
  const editor = EDITORS[STEP_IDS[wizardStep]];
  if (editor) await editor.save();
  await refreshState();
}

async function onNext() {
  try {
    await saveCurrentStep();
    wizardStep = Math.min(STEP_IDS.length - 1, wizardStep + 1);
    render();
  } catch (e) {
    alert("Не удалось сохранить: " + e.message);
  }
}

async function goToStep(target) {
  try {
    await saveCurrentStep();
  } catch (e) {
    alert("Не удалось сохранить: " + e.message);
    return; // stay put rather than navigating away from an unsaved/broken step
  }
  wizardStep = target;
  render();
}

async function runFinish(msgId) {
  showMsg(msgId, "info", `<span class="spinner"></span> Запускаю службу… при первом запуске это может занять до двух минут.`);
  try {
    const res = await api("POST", "/api/finish");
    await refreshState();
    if (res.ok) {
      view = "settings";
      section = "overview";
      dirty = false;
      restartNeeded = false;
      render();
      showMsg("dash-msg", "ok", res.message +
        `<br/><a class="link" href="${robotUrl()}" target="_blank">Открыть страницу робота →</a>`);
      return;
    }
    showMsg(msgId, "warn", res.message);
  } catch (e) {
    showMsg(msgId, "bad", e.message);
  }
}

function sectionLogs() {

      <div id="log-holder" style="margin-top:12px;"></div>
    </div>`;
}

function bindSettings() {
  const root = document.getElementById("app");
  root.querySelectorAll(".side-item").forEach(el => el.addEventListener("click", () => {
    switchSection(el.dataset.section);
  }));
  const banner = root.querySelector("#btn-restart-banner");
  if (banner) banner.addEventListener("click", () => doServiceAction("restart"));

  if (section === "overview") {
    root.querySelector("#btn-restart").addEventListener("click", () => doServiceAction("restart"));
    root.querySelector("#btn-stop").addEventListener("click", () => doServiceAction("stop"));
    root.querySelector("#btn-start").addEventListener("click", () => doServiceAction("start"));
    root.querySelector("#btn-wizard").addEventListener("click", () => {
      view = "wizard"; wizardStep = 0; dirty = false; render();
    });
    return;
  }
  if (section === "logs") {
    root.querySelector("#btn-load-logs").addEventListener("click", loadLogs);
    loadLogs();
    return;
  }

  const save = root.querySelector("#btn-save-section");
  if (save) save.addEventListener("click", saveSection);

  // Any keystroke or toggle inside a settings pane is an unsaved edit --
  // this is what puts the • marker in the sidebar and what makes
  // switchSection() flush before navigating away. Attached for the
  // advanced pane too: its fields are the ones a customer is LEAST able
  // to retype from memory if the sidebar dropped them.
  const pane = root.querySelector(".pane");
  pane.addEventListener("input", markDirty);
  pane.addEventListener("change", markDirty);

  if (section === "advanced") {
    if (!advancedGroups) loadAdvancedSettings();
    return;
  }
  EDITORS[section].bind(root);
}

function markDirty() {
  if (view !== "settings" || dirty) return;
  dirty = true;
  const active = document.querySelector(".side-item.active");
  if (active && !active.querySelector(".dot")) {
    active.insertAdjacentHTML("beforeend", `<span class="dot" title="есть несохранённые изменения">•</span>`);
  }
}

// Same discipline as the wizard's save-then-navigate (see bindWizard):
// leaving a pane with edits in it flushes them first, so the sidebar can
// never quietly throw away something the customer typed.
async function switchSection(target) {
  if (target === section) return;
  if (dirty) {
    try { await saveSection({ silent: true }); }
    catch (e) { alert("Не удалось сохранить: " + e.message); return; }
  }
  section = target;
  dirty = false;
  render();
}

async function saveSection(opts) {
  const silent = opts && opts.silent === true;
  try {
    if (section === "advanced") await saveAdvancedSettings();
    else await EDITORS[section].save();
    await refreshState();
    dirty = false;
    if (state.service_status && state.service_status.is_active) restartNeeded = true;
    if (!silent) {
      render();
      showMsg("section-msg", "ok", "Сохранено.");
    }
  } catch (e) {
    if (silent) throw e;
    showMsg("section-msg", "bad", e.message);
  }
}

async function loadAudioDevices() {
  const { capture, playback } = await api("GET", "/api/audio/devices");
  const micSel = document.getElementById("mic-select");
  const spkSel = document.getElementById("speaker-select");
  if (!micSel || !spkSel) return;
  const fill = (sel, items, current) => {
    if (!items.length) {
      sel.innerHTML = `<option value="">Устройства не найдены</option>`;
      return;
    }
    // An explicit "none" entry, not just the absence of a selection: it is
    // the only way to UNSET a USB device once one was chosen, which is what
    // stops session_hub from constructing that source at all.
    const none = `<option value="" ${current ? "" : "selected"}>— не используется —</option>`;
    sel.innerHTML = none + items.map(d => `<option value="${escapeHtml(d.id)}" ${d.id === current ? "selected" : ""}>${escapeHtml(d.label)}</option>`).join("");
  };
  fill(micSel, capture, draft.usb_mic_alsa_device);
  fill(spkSel, playback, draft.usb_speaker_alsa_device);
  micSel.addEventListener("change", () => draft.usb_mic_alsa_device = micSel.value);
  spkSel.addEventListener("change", () => draft.usb_speaker_alsa_device = spkSel.value);
}

async function loadGuardKbStatus() {
  try {
    const res = await api("GET", "/api/guard-kb/status");
    const el = document.getElementById("kb-status");
    if (!el) return;
    if (!res.exists) {
      el.className = "msg bad";
      el.textContent = `Файл не найден: ${res.path}`;
    } else if (res.rooms === 0 && res.faq === 0) {
      el.className = "msg warn";
      el.textContent = `Файл найден, но пуст (${res.path}) — заполните его реальными данными перед вводом в эксплуатацию.`;
    } else {
      el.className = "msg ok";
      el.textContent = `Загружен: ${res.rooms} кабинетов, ${res.faq} вопросов (${res.path}).`;
    }
  } catch (e) {
    const el = document.getElementById("kb-status");
    if (el) el.textContent = "Не удалось проверить: " + e.message;
  }
}

function showMsg(id, kind, html) {
  const el = document.getElementById(id);
  if (el) { el.className = "msg " + kind; el.innerHTML = html; }
}

// ------------------------------------------------------------------------
// Advanced settings -- every remaining .env knob (app/installer/
// settings_schema.py) that isn't already covered by a friendly section:
// Gemini model/voice, wake-word tuning, presence tuning, robot/USB
// hardware audio parameters, knowledge-base/RAG knobs, per-profile paths.
// Everything here used to require hand-editing `.env` over SSH.
// ------------------------------------------------------------------------

async function loadAdvancedSettings() {
  try {
    const res = await api("GET", "/api/advanced-settings");
    advancedGroups = res.groups;
    render();
  } catch (e) {
    document.querySelector(".pane").innerHTML =
      `<div class="card msg bad">Не удалось загрузить настройки: ${escapeHtml(e.message)}</div>`;
  }
}

function renderAdvancedField(field) {
  const id = `adv-${field.key}`;
  const help = field.help ? `<p class="muted" style="margin:2px 0 10px;">${escapeHtml(field.help)}</p>` : "";
  if (field.type === "toggle") {
    return `
      <div style="margin:14px 0;">
        <label style="display:flex;align-items:center;gap:8px;">
          <input type="checkbox" id="${id}" data-key="${field.key}" data-type="toggle" ${field.value === "true" ? "checked" : ""}/>
          ${escapeHtml(field.label)}
        </label>
        ${help}
      </div>`;
  }
  let control;
  if (field.type === "select") {
    const opts = (field.options || []).map(o =>
      `<option value="${escapeHtml(o.value)}" ${o.value === field.value ? "selected" : ""}>${escapeHtml(o.label)}</option>`
    ).join("");
    control = `<select id="${id}" data-key="${field.key}" data-type="select">${opts}</select>`;
  } else {
    const inputType = field.type === "number" ? "number" : field.type === "password" ? "password" : "text";
    const stepAttr = field.step ? ` step="${escapeHtml(field.step)}"` : "";
    control = `<input type="${inputType}" id="${id}" data-key="${field.key}" data-type="${field.type}"${stepAttr} value="${escapeHtml(field.value)}" />`;
  }
  return `
    <label class="field">
      <span class="lbl">${escapeHtml(field.label)}</span>
      ${control}
    </label>
    ${help}`;
}

async function saveAdvancedSettings() {
  const values = {};
  document.querySelectorAll("[data-key]").forEach(el => {
    values[el.dataset.key] = el.dataset.type === "toggle" ? (el.checked ? "true" : "false") : el.value;
  });
  await api("POST", "/api/advanced-settings", { values });
  // Re-read so the next render shows what the server actually stored
  // (unknown keys are dropped server-side) rather than the DOM's guess.
  const res = await api("GET", "/api/advanced-settings");
  advancedGroups = res.groups;
}

async function doServiceAction(verb) {
  showMsg("dash-msg", "info", `<span class="spinner"></span> Выполняю…`);
  try {
    await api("POST", `/api/service/${verb}`);
    await new Promise(r => setTimeout(r, 1000));
    await refreshState();
    if (verb === "restart" || verb === "start") restartNeeded = false;
    render();
    showMsg("dash-msg", "ok", "Готово.");
  } catch (e) {
    showMsg("dash-msg", "bad", e.message);
  }
}

async function loadLogs() {
  const holder = document.getElementById("log-holder");
  if (!holder) return;
  holder.innerHTML = `<span class="spinner"></span> Загружаю…`;
  try {
    const res = await api("GET", "/api/service/logs?lines=80");
    holder.innerHTML = res.entries.map(e => `
      <div class="log-entry">
        ${e.friendly ? `<div class="friendly">${escapeHtml(e.friendly)}</div>` : ""}
        <div class="log-line">${escapeHtml(e.raw)}</div>
      </div>`).join("") || `<span class="muted">Пусто.</span>`;
  } catch (e) {
    holder.innerHTML = `<span class="muted">Не удалось загрузить: ${escapeHtml(e.message)}</span>`;
  }
}

function escapeHtml(s) {
  return String(s == null ? "" : s)
    .replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ------------------------------------------------------------------ init --

(async function init() {
  await refreshState();
  view = state.setup_complete ? "settings" : "wizard";
  section = "overview";
  wizardStep = 0;
  render();
})();
</script>
</body>

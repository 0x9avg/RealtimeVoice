[project]
name = "realtimevoice"
version = "1.0.0"
description = "Speech-to-speech voice AI backend for the Unitree R1/G1 robots — Gemini Live API + tool calling."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # app/guard_kb.py's `import yaml` — was only present transitively via
    # uvicorn[standard] before the g1 profile needed it directly.
    "pyyaml>=6.0",
    # app/presence.py's MotionDetector (JPEG decode + grayscale diff). Both
    # were already present on the robot transitively via the manually
    # installed unitree_sdk2py stack — same class of risk `pyyaml` was
    # before it got listed explicitly (a `uv sync` can prune what it doesn't
    # know is needed).
    "numpy>=1.26",
    "pillow>=10.0",
    # audioop (app/robot_audio.py's resampling) is stdlib on 3.12, removed in
    # 3.13+. The robot runs 3.12; this shim only matters for dev machines on
    # newer Python (this one is 3.14).
    "audioop-lts>=0.2; python_version >= '3.13'",
    # app/wake_word.py — local wake-word gate for the hardware mic (item 5,
    # 2026-09-04 fixes list; switched from openWakeWord to faster-whisper
    # the same day so the wake phrase can be Russian — see that module's
    # docstring). Prebuilt wheels (ctranslate2 included) for both x86_64
    # and aarch64/cp312 — no manual/vendor install dance needed, plain
    # `uv sync` covers it. Only actually imported (and its model loaded) if
    # a hardware mic is configured — see WakeWordDetector._ensure_model.
    "faster-whisper>=1.0",
]

# unitree_sdk2py is not on PyPI; it's built on the robot from the vendor's
# git repo (see README.md's "Запуск на роботе"). Not listed as a dependency
# here — app/robot_audio.py imports it lazily so the rest of this package
# stays installable everywhere else.

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
# Only for scripts/build_wall_agent_windows.bat, run on a Windows BUILD
# machine to produce the standalone wall-agent.exe (see that script and
# README.md's "Видеостена" — "Установка на Windows-ПК стены"). Not needed
# on the robot or in normal dev — a separate group so `uv sync` there never
# pulls in PyInstaller by default.
build-windows = [
    "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
